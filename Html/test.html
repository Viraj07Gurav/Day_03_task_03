<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calorie Tracker</title>
  <link rel="stylesheet" href="test.css">
</head>
<body>
  <div class="tracker-card">
    <h2>Burn 600 kcal</h2>
    <p class="goal-status">6 of 7 goals this week • 85% completed</p>
    <div class="day-stats">
      <div class="day">
        <p>Mon</p>
        <span class="calories">626</span>
      </div>
      <div class="day">
        <p>Tue</p>
        <span class="calories">678</span>
      </div>
      <div class="day">
        <p>Wed</p>
        <span class="calories">767</span>
      </div>
      <div class="day">
        <p>Thu</p>
        <span class="calories">608</span>
      </div>
      <div class="day highlight">
        <p>Fri</p>
        <span class="calories">301</span>
      </div>
      <div class="day">
        <p>Sat</p>
        <span class="calories">808</span>
      </div>
      <div class="day">
        <p>Sun</p>
        <span class="calories">675</span>
      </div>
    </div>
    <div class="summary">
      <div class="total">
        <p>Total calories</p>
        <span>4465 kcal</span>
      </div>
      <div class="average">
        <p>Avg daily calories</p>
        <span>637 kcal</span>
      </div>
    </div>
  </div>
</body>
</html>
