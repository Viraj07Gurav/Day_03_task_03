<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <main>
        <header>
            <div id="header-cnt">
                <!-- left-cnt -->
                <div class="left-cnt">
                    <img src="Assests/heatBeat.png" alt="img">
                </div>

                <!-- middle container -->
                <div class="middle-cnt">
                    <div class="title-cnt">
                        <h2>Burn 600 kcal</h2>
                    </div>
                    <div class="goal-cnt">
                        <h3>6 of 7 goals this week .</h3>
                    </div>
                    <div class="percent-cnt">
                        85% completed
                    </div>
                </div>
                <!-- right-container -->
                <div class="left-cnt">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>
            </div>
        </header>
        <!-- header end -->

        <!-- line start -->
         <div class="line">

         </div>

         <!-- line end -->
          <div class="days">

            <div class="day">
                <h4 class="dayName">Mon</h4>
                <div class="calories-img">
                    <img src="Assests/fire_icon_white_fill.png" alt="">
                </div>
                <h3 class="NumberOfcal">626</h3>
            </div>
            <div class="day">
                <h4 class="dayName">Tues</h4>
                <div class="calories-img">    <img src="Assests/fire_icon_white_fill.png" alt=""></div>
                <h3 class="NumberOfcal">678</h3>
            </div>
            <div class="day">
                <h4 class="dayName">Wed</h4>
                <div class="calories-img">
                    <img src="Assests/fire_icon_white_fill.png" alt="">
                </div>
                <h3 class="NumberOfcal">768</h3>
            </div>
            <div class="day"> <h4 class="dayName">Thu</h4>
                <div class="calories-img">
                    <img src="Assests/fire_icon_white_fill.png" alt="">
                </div>
                <h3 class="NumberOfcal">608</h3></div>
            <div class="day" >
                <h4 class="dayName">Fri</h4>
                <div class="calories-img" style="background-color: rgb(81, 3, 1);" id="friday">
                    <img class="gff" src="Assests/red fire.png" alt="">
                </div>
                <h3 class="NumberOfcal">301</h3>
            </div>
            <div class="day">
                <h4 class="dayName">Sat</h4>
                <div class="calories-img">
                    <img src="Assests/fire_icon_white_fill.png" alt="">
                </div>
                <h3 class="NumberOfcal">808</h3>
            </div>
            <div class="day">
                <h4 class="dayName">Sun</h4>
                <div class="calories-img">
                    <img src="Assests/fire_icon_white_fill.png" alt="">
                </div>
                <h3 class="NumberOfcal">675</h3>
            </div>

          </div>

          <footer>
            <div id="left">
                <p><span>4.465</span>Kcal <br></p> 
                <h4>Total calories</h4>
            </div>
            <div id="middle">
                <p><span>637</span>kcal </p><h4>Avg daily calories</h4>
            </div>
            <div id="right">
                <img src="Assests/fire_icon_white_fill.png" alt="">
            </div>
          </footer>
          
    </main>
</body>
</html>
